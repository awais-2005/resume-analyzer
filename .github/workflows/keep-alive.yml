name: Keep Backend Alive

on:
  schedule:
    # Every 10 minutes (Render free tier spins down after ~15 min idle)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "Status: %{http_code}\n" "${{ secrets.BACKEND_URL }}/health" || echo "Ping failed (backend may be cold-starting)"
